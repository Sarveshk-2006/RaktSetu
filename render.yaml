services:
  # ─── FastAPI Production Web Service ────────────────────────────────────────
  - type: web
    name: raktsetu-backend
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ENVIRONMENT
        value: production
      - key: AUTH_STRICT
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://raktsetu.vercel.app","https://raktsetu-demo.vercel.app"]'
      - key: DATABASE_URL
        fromDatabase:
          name: raktsetu-db
          property: connectionString

databases:
  # ─── Managed PostgreSQL 16 Database ───────────────────────────────────────
  - name: raktsetu-db
    databaseName: raktsetu_prod
    user: raktsetu_admin
    region: frankfurt
    plan: starter
    postgresMajorVersion: "16"
